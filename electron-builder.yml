appId: com.markpad.editor
productName: Markpad
copyright: Copyright © 2026 Markpad

directories:
  output: distro
  buildResources: build

# Ad-hoc signs the macOS .app (see the script for why).
afterPack: scripts/after-pack.js

# Only what the app actually needs at runtime. Production node_modules
# (marked) are added by electron-builder automatically.
files:
  - main.js
  - preload.js
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.md"

fileAssociations:
  - ext: [md, markdown, mdown, mkd]
    name: Markdown Document
    description: Markdown Document
    role: Editor
    mimeType: text/markdown

# ------------------------------------------------------------------ macOS --
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  darkModeSupport: true
  minimumSystemVersion: "11.0"        # Electron 33 = macOS Big Sur and up

  # There is no paid Apple Developer account, so electron-builder cannot sign
  # with a Developer ID or notarize. It is told to do nothing here; instead
  # scripts/after-pack.js ad-hoc signs the whole .app, which is enough for it
  # to launch on Apple Silicon and not read as "damaged". Gatekeeper still
  # quarantines the download — users clear that once (right-click > Open, the
  # Homebrew cask with --no-quarantine, or `xattr -dr com.apple.quarantine`).
  # To sign properly later: set `identity` to your "Developer ID Application"
  # name, `hardenedRuntime: true`, add an entitlements plist and `notarize`.
  identity: null
  gatekeeperAssess: false            # don't run spctl during the build

  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip                    # for Homebrew cask / manual unzip
      arch: [arm64, x64]

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
      type: file
    - x: 390
      y: 190
      type: link
      path: /Applications

# ------------------------------------------------------------------ Linux --
linux:
  # A directory of NxN.png files, so hicolor gets every size it wants.
  icon: build/icons
  category: Office;Utility;TextEditor
  synopsis: Minimal Markdown editor
  # Also becomes the .desktop Comment= tooltip, so keep it to one sentence.
  description: >
    Markdown editor with light/dark themes, a file browser, a formatting
    toolbar and live preview.
  maintainer: bochtis.d <powertec01@hotmail.com>
  vendor: Markpad
  # The AppImage builder rejects an `ext` list, so Linux gets one entry per
  # extension (the deb is fine with either form). The MIME type goes on one
  # entry only, so the .desktop MimeType= line does not repeat it per entry.
  fileAssociations:
    - { ext: md, name: Markdown Document, mimeType: text/markdown, role: Editor }
    - { ext: markdown, name: Markdown Document, role: Editor }
    - { ext: mdown, name: Markdown Document, role: Editor }
    - { ext: mkd, name: Markdown Document, role: Editor }
  # Flat map of Desktop Entry keys (electron-builder 25 does not nest these).
  desktop:
    Keywords: markdown;md;editor;text;notes;writing;
    StartupWMClass: Markpad
  target:
    - target: deb
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64, arm64]

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  artifactName: ${name}_${version}_${arch}.${ext}
  packageCategory: editors   # Debian "Section:" field
  priority: optional
  compression: xz
