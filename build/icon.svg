<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5C97FF"/>
      <stop offset="55%"  stop-color="#3563E9"/>
      <stop offset="100%" stop-color="#2038AE"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0d1533" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <g filter="url(#soft)">
    <rect x="72" y="72" width="880" height="880" rx="198" fill="url(#bg)"/>
    <rect x="72" y="72" width="880" height="880" rx="198" fill="url(#sheen)"/>
    <rect x="73.5" y="73.5" width="877" height="877" rx="196.5"
          fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="3"/>
  </g>

  <!-- markdown mark: M + down arrow, centred on the tile -->
  <g fill="#ffffff" transform="translate(-36,-24)">
    <path d="M232 372 h92 l104 132 104 -132 h92 v300 h-92 V508 l-104 130 -104 -130 v164 h-92 Z"/>
    <path d="M702 372 h88 v164 h74 L746 700 628 536 h74 Z"/>
  </g>
</svg>
